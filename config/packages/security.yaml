security:
    # password hashers (Symfony >=5.3 uses "password_hashers")
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|build)/
            security: false

        # API firewall - stateless, JWT secured
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            custom_authenticator: App\Security\ApiJwtAuthenticator

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                success_handler: App\Security\LoginSuccessHandler

            logout:
                path: app_logout

    access_control:
    
        # assets + login/logout accessibles publiquement
        - { path: ^/(_(profiler|wdt)|css|images|js|build)/, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        
        # API login endpoint is public
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        
        # All other API endpoints require authentication
        - { path: ^/api, roles: ROLE_USER }
        
        # Web routes require authentication
        - { path: ^/, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_ADMIN }
